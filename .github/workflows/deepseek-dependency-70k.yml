name: DeepSeek dependency 70k experiment

on:
  push:
    branches:
      - experiment/deepseek-dependency-70k-2026-09-07
    paths:
      - '.github/workflows/deepseek-dependency-70k.yml'
      - 'experiments/deepseek-dependency-70k-2026-09-07/run.py'

permissions:
  contents: write

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/deepseek-dependency-70k-2026-09-07
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify credential presence without exposing it
        run: |
          if [ -z "$OLLAMA_API_KEY" ]; then
            echo 'OLLAMA_API_KEY repository secret is not configured.'
            exit 3
          fi
      - name: Install harness
        run: python -m pip install -e .
      - name: Run DeepSeek dependency experiment
        run: python experiments/deepseek-dependency-70k-2026-09-07/run.py
      - name: Commit raw results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f experiments/deepseek-dependency-70k-2026-09-07/results
          if git diff --cached --quiet; then
            echo 'No result files changed.'
            exit 0
          fi
          git commit -m 'Record DeepSeek 70k dependency experiment results'
          git push origin HEAD:experiment/deepseek-dependency-70k-2026-09-07
